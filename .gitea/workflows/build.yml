name: Build Echo Dashboard

# Build only — pas de déploiement, ce n'est pas un service (même schéma que
# CoqDecks / ManyCoqDecks). Le résultat (APK debug + rapports de tests/lint)
# est empaqueté dans une image "coffre-fort" poussée sur le registre interne ;
# voir docs/CI.md pour la récupération.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: native
    timeout-minutes: 120

    steps:
      - name: Build and push Echo Dashboard artifacts with BuildKit
        run: |
          kubectl -n ci delete job echo-dashboard-buildkit --ignore-not-found=true --wait=true

          BRANCH=${GITEA_REF_NAME:-${GITHUB_REF_NAME:-main}}
          cat <<'EOF' | sed "s|__BRANCH__|${BRANCH}|g" | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: echo-dashboard-buildkit
            namespace: ci
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                initContainers:
                  - name: prepare
                    image: alpine/git:latest
                    command: ["sh", "-c"]
                    args:
                      - |
                        set -eux
                        REG=registry.git.svc.cluster.local:5000
                        git clone --depth 1 --branch __BRANCH__ https://git.alocoq.fr/alois/Echo-dashboard.git /workspace/repo

                        # Image de base (JDK + Android SDK, ~1 Go) reconstruite
                        # uniquement quand docker/ci-base.Dockerfile change,
                        # taguée par hash de contenu — même logique que le
                        # Dockerfile-base de Verso.
                        BTAG=$(sha256sum /workspace/repo/docker/ci-base.Dockerfile | cut -c1-16)
                        printf '%s' "$BTAG" > /workspace/base_tag
                        if wget -qO- "http://$REG/v2/echo-dashboard-ci-base/tags/list" 2>/dev/null | grep -q "\"base-$BTAG\""; then
                          echo "Base image base-$BTAG already present - skipping base build"
                        else
                          touch /workspace/build-base
                          echo "Base image base-$BTAG not found - base will be built"
                        fi
                    volumeMounts:
                      - name: workspace
                        mountPath: /workspace

                containers:
                  - name: buildkit
                    image: moby/buildkit:latest
                    securityContext:
                      privileged: true
                    command: ["sh", "-c"]
                    args:
                      - |
                        set -eux
                        REG=registry.git.svc.cluster.local:5000

                        mkdir -p /etc/buildkit
                        printf '[registry."%s"]\n  http = true\n  insecure = true\n' "$REG" > /etc/buildkit/buildkitd.toml

                        BTAG=$(cat /workspace/base_tag)
                        BASE_REF="$REG/echo-dashboard-ci-base:base-$BTAG"

                        if [ -f /workspace/build-base ]; then
                          buildctl-daemonless.sh build \
                            --frontend=dockerfile.v0 \
                            --local context=/workspace/repo \
                            --local dockerfile=/workspace/repo/docker \
                            --opt filename=ci-base.Dockerfile \
                            --output type=image,name=$BASE_REF,push=true,registry.insecure=true
                        else
                          echo "Reusing existing base image $BASE_REF"
                        fi

                        # Build réel (deps Gradle mises en cache côté registre,
                        # puis compilation + tests + lint).
                        buildctl-daemonless.sh build \
                          --frontend=dockerfile.v0 \
                          --local context=/workspace/repo \
                          --local dockerfile=/workspace/repo/docker \
                          --opt filename=Dockerfile \
                          --opt build-arg:CI_BASE_IMAGE=$BASE_REF \
                          --import-cache type=registry,ref=$REG/echo-dashboard-cache:app \
                          --export-cache type=registry,ref=$REG/echo-dashboard-cache:app,mode=max \
                          --output type=image,name=$REG/echo-dashboard:latest,push=true,registry.insecure=true
                    volumeMounts:
                      - name: workspace
                        mountPath: /workspace

                volumes:
                  - name: workspace
                    emptyDir: {}
          EOF

      - name: Wait for build
        # `kubectl wait --for=condition=complete` only ever resolves on the
        # Complete condition: a Job that fails (e.g. InitError in `prepare`,
        # backoffLimit: 0) never gets one, so that call would just block for
        # the full --timeout instead of reporting the failure.
        #
        # Poll `.status.succeeded` / `.status.failed` instead of
        # `.status.conditions[?(@.type==...)]`: those are plain top-level
        # integers set as soon as the (single, since backoffLimit: 0) pod
        # finishes, with no bracket-filter jsonpath involved — the filter
        # syntax turned out to be unreliable on this runner's kubectl and
        # silently returned nothing (swallowed by `2>/dev/null`), so the loop
        # never saw a failure and ran until the full timeout anyway.
        run: |
          NS=ci
          JOB=echo-dashboard-buildkit
          TIMEOUT=7200
          INTERVAL=5
          ELAPSED=0

          while true; do
            SUCCEEDED=$(kubectl -n "$NS" get job "$JOB" -o jsonpath='{.status.succeeded}' 2>/dev/null)
            FAILED=$(kubectl -n "$NS" get job "$JOB" -o jsonpath='{.status.failed}' 2>/dev/null)
            SUCCEEDED=${SUCCEEDED:-0}
            FAILED=${FAILED:-0}

            if [ "$SUCCEEDED" -ge 1 ]; then
              echo "Job $JOB completed successfully."
              exit 0
            fi

            if [ "$FAILED" -ge 1 ]; then
              # Best-effort extra detail; must not gate control flow above,
              # only the succeeded/failed counts do.
              REASON=$(kubectl -n "$NS" get job "$JOB" -o jsonpath='{.status.conditions[?(@.type=="Failed")].reason}{" - "}{.status.conditions[?(@.type=="Failed")].message}' 2>/dev/null)
              echo "Job $JOB failed (backoffLimit: 0, no retries). $REASON"
              echo "See the 'Show build logs' step below for container logs."
              exit 1
            fi

            if [ "$ELAPSED" -ge "$TIMEOUT" ]; then
              echo "Timed out after ${TIMEOUT}s waiting for job $JOB."
              exit 1
            fi

            sleep "$INTERVAL"
            ELAPSED=$((ELAPSED + INTERVAL))
          done

      - name: Show build logs
        if: always()
        run: |
          kubectl -n ci logs job/echo-dashboard-buildkit -c prepare || true
          kubectl -n ci logs job/echo-dashboard-buildkit -c buildkit || true

      - name: Cleanup
        if: always()
        run: |
          kubectl -n ci delete job echo-dashboard-buildkit --ignore-not-found=true --wait=true
